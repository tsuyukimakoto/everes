name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: false

      - name: Build darwin/arm64
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p build
          VERSION="${TAG}+${SHA::7}"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath \
            -ldflags "-X github.com/tsuyukimakoto/everes/internal/cli.Version=${VERSION}" \
            -o build/everes-darwin-arm64 ./cmd/everes

      - name: Create checksum
        run: |
          cd build
          sha256sum everes-darwin-arm64 > ../checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/everes-darwin-arm64 checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare signed darwin/arm64 artifact
        run: |
          mkdir -p build
          cp .apm/skills/everes-task/bin/everes build/everes-darwin-arm64
          chmod 0755 build/everes-darwin-arm64
          cd build
          zip -9 everes-darwin-arm64.zip everes-darwin-arm64

      - name: Create checksum
        run: |
          cd build
          sha256sum everes-darwin-arm64 everes-darwin-arm64.zip > ../checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/everes-darwin-arm64 build/everes-darwin-arm64.zip checksums.txt \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"

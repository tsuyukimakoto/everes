name: everes
version: "0.4.1"
description: Task Context Manager for parallel AI coding work
author: tsuyukimakoto
license: MIT
targets:
  - claude
  - codex
includes: auto
# hookは配置先ごとに別package（.apm/packages/everes-*-hook）として独立させ、
# per-dependency targetsでClaude/Codexの一方だけへ配布する。
dependencies:
  apm:
    - path: ./.apm/packages/everes-claude-hook
      targets:
        - claude
    - path: ./.apm/packages/everes-codex-hook
      targets:
        - codex
  mcp: []
